[package]
name = "g600-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "g600-switcher"
path = "src/main.rs"

[dependencies]
g600-core = { path = "../g600-core" }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
tray-icon = "0.26"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
